<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Vault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔐 Personal Vault</h1>
      <p class="subtitle">Encrypted file rooms with password protection</p>

      <div class="tabs">
        <button class="tab active" data-tab="join">Join Room</button>
        <button class="tab" data-tab="create">Create Room</button>
      </div>

      <div id="tab-join" class="tab-content active">
        <div class="form-group">
          <label for="join-room-id">Room ID</label>
          <input type="text" id="join-room-id" placeholder="e.g. a1b2c3d4" maxlength="64">
        </div>
        <button class="btn primary" id="btn-join">Join Room</button>
      </div>

      <div id="tab-create" class="tab-content">
        <div class="form-group">
          <label for="new-room-id">Room ID (optional)</label>
          <input type="text" id="new-room-id" placeholder="Leave blank to auto-generate" maxlength="64">
        </div>
        <div class="form-group">
          <label for="new-password">Room Password</label>
          <input type="password" id="new-password" placeholder="Set a password for this room" autocomplete="new-password">
        </div>
        <button class="btn primary" id="btn-create">Create Room</button>
      </div>

      <div id="error-message" class="error hidden"></div>
      <div id="status-message" class="status hidden"></div>
    </div>
  </div>

  <script src="js/crypto.js"></script>
  <script src="js/github.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
